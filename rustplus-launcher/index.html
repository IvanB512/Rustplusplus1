<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust++ Launcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Модальное окно активации -->
        <div id="activationModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🔐 Активация продукта</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <p>Введите ключ активации для использования Rust++ Launcher:</p>
                    <input type="text" id="activationKey" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19">
                    <button id="activateBtn" class="btn btn-primary">Активировать</button>
                    <div id="activationMessage"></div>
                </div>
            </div>
        </div>

        <header>
            <div class="header-left">
                <h1>🚀 Rust++ Launcher</h1>
                <div class="activation-status">
                    <span id="activationStatus" class="status-badge">🔴 Не активирован</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="project-section">
                <div class="section-header">
                    <h2>📁 Настройки проекта</h2>
                </div>
                
                <div class="path-selector">
                    <input type="text" id="projectPath" placeholder="Выберите папку проекта..." readonly>
                    <button id="browseBtn" class="btn btn-secondary">📂 Обзор</button>
                </div>
                
                <div class="project-info">
                    <div class="info-item">
                        <span class="label">Папка проекта:</span>
                        <span id="currentProject" class="value">Не выбрана</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Статус:</span>
                        <span id="status" class="status-stopped">🛑 Остановлен</span>
                    </div>
                    <div class="info-item">
                        <span class="label">ID процесса:</span>
                        <span id="pid" class="value">-</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="btn btn-success" disabled>
                        🚀 Запустить проект
                    </button>
                    <button id="stopBtn" class="btn btn-danger" disabled>
                        ⏹️ Остановить проект
                    </button>
                </div>
            </div>

            <div class="console-section">
                <div class="section-header">
                    <h3>📊 Вывод консоли</h3>
                    <button id="clearConsole" class="btn btn-secondary">🧹 Очистить</button>
                </div>
                <div id="output" class="console-output"></div>
            </div>
        </div>

        <footer>
            <div class="footer-info">
                <span>✨ Rust++ Launcher v1.0.0</span>
                <span id="systemInfo">Загрузка информации о системе...</span>
            </div>
        </footer>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
