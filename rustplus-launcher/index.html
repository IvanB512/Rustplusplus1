<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust++ Launcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Rust++ Launcher</h1>
        </header>

        <div class="project-section">
    <h3>📁 Выбор проекта</h3>
    <div class="path-selector">
        <input type="text" id="projectPath" placeholder="Выберите папку с проектом..." readonly>
        <button class="btn btn-browse" onclick="browseFolder()">Обзор</button>
        <button class="btn btn-clear" onclick="clearSavedPath()" title="Очистить сохраненный путь">🗑️</button>
    </div>
    <div id="projectInfo" class="project-info"></div>
</div>


        <div class="control-section">
            <h3>⚙️ Управление</h3>
            <div class="button-group">
                <button class="btn btn-start" onclick="startProject()" disabled>Запустить</button>
                <button class="btn btn-stop" onclick="stopProject()" disabled>Остановить</button>
            </div>
        </div>

        <div class="status-section">
            <h3>📊 Статус</h3>
            <div id="status" class="status stopped">
                <span class="status-text">Проект не выбран</span>
                <div class="status-indicator"></div>
            </div>
        </div>

        <div class="logs-section">
            <h3>📝 Логи проекта</h3>
            <div class="log-controls">
                <button class="btn btn-small" onclick="clearLogs()">Очистить логи</button>
            </div>
            <div id="logs" class="logs-container">
                <div class="log-entry info">Готов к работе...</div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
